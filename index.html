<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSustentável | O Futuro da Terra</title>
    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* Cabeçalho e Menu */
        header {
            background-color: #2e7d32;
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Banner Principal */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?ixlib=rb-4.0.3') no-repeat center center/cover;
            height: 60vh;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        /* Seções de Conteúdo */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .section-title {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #2e7d32;
        }

        .card h3 {
            color: #1b5e20;
            margin-bottom: 1rem;
        }

        /* Sobre o Agro Sustentável */
        .about-text {
            font-size: 1.1rem;
            text-align: justify;
            margin-bottom: 1.5rem;
        }

        /* Rodapé */
        footer {
            background-color: #1b5e20;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>AgroSustentável</h1>
        <nav>
            <a href="#sobre">Sobre</a>
            <a href="#pilares">Pilares</a>
            <a href="#praticas">Práticas</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Agricultura do Futuro</h2>
        <p>Produzindo alimentos de forma inteligente, preservando o meio ambiente e garantindo o sustento das próximas gerações.</p>
    </section>

    <main class="container">
